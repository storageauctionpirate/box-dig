<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2b2118">
<title>Storage Pirate: Box Dig</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%93%A6%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:,">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#1c1510;font-family:"Trebuchet MS",system-ui,-apple-system,sans-serif;color:#fff4e0;overflow:hidden}
#app{position:relative;width:100%;max-width:480px;height:100%;margin:0 auto;overflow:hidden;background:radial-gradient(ellipse at 50% 0%,#5a4632 0%,#2b2118 70%)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
.btn{border:0;border-radius:18px;font-family:inherit;font-weight:900;font-size:22px;line-height:1.05;padding:18px 20px;min-height:62px;color:#2b1a08;background:linear-gradient(#ffd24d,#f0a020);box-shadow:0 6px 0 #9a5d0a,0 10px 18px #0007;cursor:pointer;letter-spacing:.5px;text-transform:uppercase}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #9a5d0a,0 4px 8px #0007}
.btn.green{background:linear-gradient(#7be07b,#2fa84a);box-shadow:0 6px 0 #1a6a2a,0 10px 18px #0007;color:#08240e}
.btn.gray{background:linear-gradient(#d8cbb6,#a8977c);box-shadow:0 6px 0 #6b5c45,0 10px 18px #0007}
.btn.red{background:linear-gradient(#ff8a7a,#d8392b);box-shadow:0 6px 0 #7d1a10,0 10px 18px #0007;color:#2a0500}
.btn[disabled]{filter:grayscale(1) brightness(.6)}
.btn.wide{width:100%}
.title{font-weight:900;text-align:center;line-height:1;text-shadow:0 3px 0 #000a}
.sub{opacity:.85;text-align:center;font-size:15px}
.money{color:#ffd24d;font-weight:900}
/* storage door */
.unitframe{position:relative;width:300px;height:300px;background:#0e0b08;border:10px solid #8d8d8d;border-top-width:22px;border-radius:6px;overflow:hidden;box-shadow:inset 0 0 40px #000,0 12px 30px #000a}
.door{position:absolute;inset:0;background:repeating-linear-gradient(180deg,var(--dc) 0 22px,var(--dd) 22px 26px);transition:transform 1.1s cubic-bezier(.6,.05,.3,1);z-index:2}
.door::after{content:"";position:absolute;left:50%;bottom:14px;width:60px;height:14px;margin-left:-30px;background:#333;border-radius:4px;box-shadow:inset 0 2px 0 #777}
.door.up{transform:translateY(-100%)}
.unitinside{position:absolute;inset:0;display:flex;flex-wrap:wrap;align-content:flex-end;justify-content:center;gap:6px;padding:12px}
/* cardboard box */
.cbox{position:relative;width:100px;height:84px;border-radius:6px;background:linear-gradient(160deg,#d9a566,#b67c3e);box-shadow:inset 0 -6px 0 #0002,0 6px 10px #0008;display:flex;align-items:center;justify-content:center;font-weight:900;color:#4a2c0c;cursor:pointer}
.cbox::before{content:"";position:absolute;left:44%;top:0;width:12%;height:100%;background:#e8c48a99}
.cbox::after{content:"";position:absolute;left:0;right:0;top:18%;height:2px;background:#0002}
.cbox .lbl{position:relative;z-index:1;font-size:13px;background:#fff8;padding:2px 6px;border-radius:4px}
.cbox.done{filter:brightness(.6);cursor:default}
.cbox .stamp{position:absolute;z-index:2;transform:rotate(-14deg);font-size:15px;font-weight:900;padding:3px 6px;border:3px solid;border-radius:6px;background:#fffc}
.stamp.ok{color:#1a7a2a}.stamp.bad{color:#c22}
.cbox.small{width:86px;height:70px}
/* top bar */
.hud{width:100%;display:flex;justify-content:space-between;align-items:center;font-size:15px;gap:8px}
.pill{background:#0006;border-radius:12px;padding:7px 11px;font-weight:800;white-space:nowrap}
.haul{margin:8px 0 6px;text-align:center}
.haul .big{font-size:40px;font-weight:900;color:#ffd24d;text-shadow:0 3px 0 #000a;transition:transform .12s}
.haul .big.pop{transform:scale(1.18)}
.haul .lab{font-size:13px;letter-spacing:2px;opacity:.8}
/* grid */
.boxwrap{position:relative;padding:12px;border-radius:12px;background:linear-gradient(160deg,#d9a566,#a8702f);box-shadow:inset 0 0 0 4px #8a5a24,0 10px 24px #000a}
.boxwrap::before{content:"";position:absolute;left:46%;top:-6px;width:8%;height:calc(100% + 12px);background:#e8c48acc;border-radius:2px;pointer-events:none;z-index:0}
.grid{position:relative;z-index:1;display:grid;gap:3px}
.cell{position:relative;border-radius:7px;background:linear-gradient(160deg,#e9c088,#c08a4c);box-shadow:inset 0 -4px 0 #8a5a2499,inset 0 2px 0 #fff4;display:flex;align-items:center;justify-content:center;font-weight:900;cursor:pointer;touch-action:manipulation;overflow:hidden}
.cell.dug{background:#4a3524;box-shadow:inset 0 3px 6px #0009;cursor:default}
.cell .num{font-size:1.25em;text-shadow:0 2px 0 #0008}
.cell .it{position:absolute;left:2px;top:1px;font-size:.62em;line-height:1}
.cell.dug.hasitem .num{position:absolute;right:4px;bottom:1px;font-size:.95em}
.cell.dug.hasitem .it{position:static;font-size:1.05em}
.cell.flag::after{content:"🚩";font-size:1.1em}
.cell.hz{background:#7a1d14}
.cell.hz.hit{background:#e83a2a;animation:pulse .5s infinite alternate}
.cell.glint::before{content:"✨";position:absolute;right:1px;top:0;font-size:.55em;animation:tw 1.2s infinite alternate}
@keyframes tw{from{opacity:.25}to{opacity:1}}
@keyframes pulse{to{filter:brightness(1.4)}}
.n1{color:#7cc4ff}.n2{color:#8fe388}.n3{color:#ff8a7a}.n4{color:#d7a0ff}.n5{color:#ffb35c}.n6{color:#5fe0d0}.n7{color:#fff}.n8{color:#ccc}
/* CSS drawn rares */
.gold{display:inline-block;width:1.2em;height:.7em;background:linear-gradient(#fff3a0,#f5c400 40%,#b88600);clip-path:polygon(18% 0,82% 0,100% 100%,0 100%);vertical-align:middle}
.safe{display:inline-block;width:.95em;height:.95em;border-radius:.12em;background:radial-gradient(circle at 50% 50%,#ddd 0 .14em,#555 .15em .2em,transparent .21em),linear-gradient(#8a9198,#4b5258);box-shadow:inset 0 0 0 .06em #2b3035;vertical-align:middle}
.controls{width:100%;margin-top:auto;display:flex;flex-direction:column;gap:12px;padding-bottom:28px}
.row{display:flex;gap:10px;width:100%}
.flagbtn{flex:0 0 96px;font-size:28px;padding:10px}
.flagbtn.on{background:linear-gradient(#ff8a7a,#d8392b);box-shadow:0 6px 0 #7d1a10}
.log{height:22px;font-size:15px;font-weight:800;text-align:center;opacity:.95}
canvas.fx{position:absolute;inset:0;pointer-events:none;z-index:20}
.float{position:absolute;z-index:21;pointer-events:none;font-weight:900;font-size:22px;color:#ffd24d;text-shadow:0 2px 0 #000;animation:fl 1s ease-out forwards}
@keyframes fl{to{transform:translateY(-60px);opacity:0}}
.shake{animation:shk .5s}
@keyframes shk{0%,100%{transform:none}15%{transform:translate(-10px,4px) rotate(-1deg)}30%{transform:translate(9px,-4px) rotate(1deg)}45%{transform:translate(-7px,3px)}60%{transform:translate(6px,-2px)}75%{transform:translate(-3px,1px)}}
.flash{position:absolute;inset:0;background:#f22;opacity:0;pointer-events:none;z-index:30;animation:fla .6s}
@keyframes fla{0%{opacity:.6}100%{opacity:0}}
/* overlay */
.ov{position:absolute;inset:0;z-index:60;background:#000b;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:20px 18px calc(30px + env(safe-area-inset-bottom));animation:fin .25s}
@keyframes fin{from{opacity:0}}
.card{width:100%;background:linear-gradient(#fff4e0,#f0d9b0);color:#3a2410;border-radius:22px;padding:20px;text-align:center;box-shadow:0 14px 40px #000;margin-bottom:auto;margin-top:auto;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.6)}}
.card h2{margin:0 0 6px;font-size:34px;font-weight:900}
.card .bigm{font-size:46px;font-weight:900;color:#1a7a2a;margin:6px 0}
.card .bigm.bad{color:#c22;text-decoration:line-through}
.card table{width:100%;font-size:17px;border-collapse:collapse;margin:8px 0}
.card td:first-child{text-align:left;white-space:nowrap}.card td{padding:5px 2px;border-bottom:1px dashed #0002}.card td:last-child{text-align:right;font-weight:900}
.finds{font-size:26px;letter-spacing:2px;margin:6px 0;min-height:30px}
/* unit list */
.ulist{width:100%;display:flex;flex-direction:column;gap:10px;overflow-y:auto;padding:4px 2px 10px}
.urow{display:flex;align-items:center;gap:12px;background:#0005;border-radius:16px;padding:10px;cursor:pointer;border:3px solid transparent}
.urow.locked{opacity:.45;cursor:default}
.urow.next{border-color:#ffd24d}
.minidoor{flex:0 0 64px;height:64px;border-radius:5px;border:4px solid #8d8d8d;border-top-width:8px;background:repeating-linear-gradient(180deg,var(--dc) 0 8px,var(--dd) 8px 10px)}
.urow .nm{font-weight:900;font-size:18px}.urow .ds{font-size:13px;opacity:.8}
.urow .pr{margin-left:auto;font-weight:900;font-size:18px;color:#ffd24d;text-align:right}
.bust-big{font-size:80px;line-height:1;animation:wob .4s infinite alternate}
@keyframes wob{from{transform:rotate(-8deg) scale(1)}to{transform:rotate(8deg) scale(1.1)}}
.howto{font-size:14px;line-height:1.4;background:#0005;border-radius:14px;padding:10px 12px;width:100%}
.mute{position:absolute;right:14px;top:60px;z-index:50;background:#0006;border:0;border-radius:12px;font-size:20px;padding:6px 9px;color:#fff;cursor:pointer}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* =====================================================================
   CONFIG — tweak odds, grid sizes, payouts here.
   ===================================================================== */
var CONFIG = {
  startCash: 1200,
  clearBonus: 0.5,          // dig every safe square = +50% of box haul
  glintHints: true,         // sparkle on dug squares touching hidden rare treasure
  longPressMs: 380,
  // weights for what a SAFE square holds (per unit, see units[].odds)
  items: {
    junk:   [["🧦","Odd Sock",1,3],["📰","Old Newspaper",1,2],["🥄","Bent Spoon",1,4],["🔌","Tangled Cord",2,5],["🧸","Worn Teddy",2,6],["📼","Mystery Tape",2,6],["🕯️","Candle Stub",1,3]],
    decent: [["🔧","Wrench Set",12,30],["📻","Vintage Radio",20,45],["💍","Silver Ring",25,50],["✉️","Cash Envelope",15,60],["⌚","Old Watch",20,55],["📷","Film Camera",18,40],["🎸","Guitar",30,70]],
    rare:   [["GOLD","Gold Bar",180,300],["🪙","Rare Coin",90,180],["SAFE","Old Safe",140,320],["💎","Loose Diamond",150,260]]
  },
  hazards: [["🐀","Rat Nest"],["🪤","Mousetrap"],["🪞","Broken Glass"],["🚔","The Bust"]],
  // boxes: [gridSize, hazardCount] per box. mult scales all item values.
  units: [
    {name:"Blue Door",   desc:"Grandma's attic overflow", cost:900,   mult:1,  door:["#3d7fd1","#2a5c9c"], odds:{empty:38,junk:42,decent:17,rare:3},  boxes:[[5,3],[5,3],[5,4],[5,4],[6,5]]},
    {name:"Green Door",  desc:"Garage guy's leftovers",   cost:3600,   mult:3,  door:["#3fa35a","#2b7a41"], odds:{empty:36,junk:40,decent:19,rare:5},  boxes:[[5,4],[6,5],[6,6],[6,6],[6,7]]},
    {name:"Red Door",    desc:"Collector's unit",          cost:13000,  mult:9,  door:["#d34a3a","#9c2f24"], odds:{empty:34,junk:37,decent:22,rare:7},  boxes:[[6,6],[6,7],[6,8],[7,9],[7,10]]},
    {name:"Yellow Door", desc:"Estate sale overflow",      cost:48000,  mult:25, door:["#e6b52c","#b08516"], odds:{empty:32,junk:34,decent:25,rare:9},  boxes:[[6,8],[7,10],[7,11],[7,12],[7,13],[8,14]]},
    {name:"Purple Door", desc:"The vault nobody paid for", cost:160000, mult:70, door:["#8a4fd1","#5f3196"], odds:{empty:30,junk:31,decent:27,rare:12}, boxes:[[7,12],[7,13],[8,14],[8,15],[8,16],[8,18]]}
  ]
};

/* =====================================================================
   BoxDig module — self-contained dig logic + one-box UI.
   BoxDig.core.newBox(opts)          pure logic (no DOM), used by sims too
   BoxDig.mountBox(el, opts, done)   UI for a single box -> done(result)
   BoxDig.start(config, onFinish)    full game shell (units, economy, save)
   ===================================================================== */
(function(){
"use strict";
var BoxDig = window.BoxDig = {};

/* ---------- pure core ---------- */
function pick(arr,rng){return arr[Math.floor(rng()*arr.length)];}
function rollItem(odds,items,mult,rng){
  var tot=odds.empty+odds.junk+odds.decent+odds.rare, x=rng()*tot;
  var cat = (x-=odds.empty)<0?null:(x-=odds.junk)<0?"junk":(x-=odds.decent)<0?"decent":"rare";
  if(!cat) return null;
  var d=pick(items[cat],rng);
  return {icon:d[0],name:d[1],cat:cat,val:Math.max(1,Math.round((d[2]+rng()*(d[3]-d[2]))*mult))};
}
function newBox(o){
  var N=o.size, H=o.hazards, rng=o.rng||Math.random, cells=[], generated=false;
  var api={N:N,cells:cells,state:"playing",haul:0,dugSafe:0,safeTotal:N*N-H,best:null,finds:[],bonus:0,lost:0,hitCell:null};
  for(var r=0;r<N;r++)for(var c=0;c<N;c++)cells.push({r:r,c:c,i:r*N+c,hz:null,item:null,dug:false,flag:false,n:0});
  function at(r,c){return (r<0||c<0||r>=N||c>=N)?null:cells[r*N+c];}
  function nb(cell){var out=[];for(var dr=-1;dr<=1;dr++)for(var dc=-1;dc<=1;dc++){if(dr||dc){var x=at(cell.r+dr,cell.c+dc);if(x)out.push(x);}}return out;}
  function gen(first){
    var ban={};ban[first.i]=1;
    var around=nb(first); if(N*N-around.length-1>=H) around.forEach(function(x){ban[x.i]=1;});
    var cand=cells.filter(function(x){return !ban[x.i];});
    for(var k=cand.length-1;k>0;k--){var j=Math.floor(rng()*(k+1));var t=cand[k];cand[k]=cand[j];cand[j]=t;}
    for(k=0;k<H;k++){var h=pick(o.hazardTypes,rng);cand[k].hz={icon:h[0],name:h[1]};}
    cells.forEach(function(x){ if(!x.hz){ x.item=rollItem(o.odds,o.items,o.mult,rng); } x.n=nb(x).filter(function(y){return y.hz;}).length; });
    generated=true;
  }
  api.neighbors=nb; api.at=at;
  api.dig=function(r,c){
    var ev=[], cell=at(r,c);
    if(api.state!=="playing"||!cell||cell.dug||cell.flag) return ev;
    if(!generated) gen(cell);
    if(cell.hz){ cell.dug=true; api.hitCell=cell; api.lost=api.haul; api.haul=0; api.state="bust"; ev.push({type:"bust",cell:cell,lost:api.lost}); return ev; }
    var stack=[cell];
    while(stack.length){
      var x=stack.pop(); if(x.dug||x.hz) continue;
      x.dug=true; x.flag=false; api.dugSafe++;
      if(x.item){ api.haul+=x.item.val; api.finds.push(x.item); if(!api.best||x.item.val>api.best.val) api.best=x.item; }
      ev.push({type:"dig",cell:x});
      if(x.n===0) nb(x).forEach(function(y){ if(!y.dug&&!y.flag&&!y.hz) stack.push(y); });
    }
    if(api.dugSafe>=api.safeTotal){ api.bonus=Math.round(api.haul*(o.clearBonus||0)); api.haul+=api.bonus; api.state="cleared"; ev.push({type:"clear",bonus:api.bonus}); }
    return ev;
  };
  api.toggleFlag=function(r,c){var x=at(r,c); if(api.state!=="playing"||!x||x.dug) return false; x.flag=!x.flag; return true;};
  api.wrap=function(){ if(api.state==="playing") api.state="banked"; return api.banked(); };
  api.banked=function(){ return (api.state==="banked"||api.state==="cleared")?api.haul:0; };
  api.glint=function(x){ return x.dug && nb(x).some(function(y){return !y.dug&&y.item&&y.item.cat==="rare";}); };
  api.generated=function(){return generated;};
  return api;
}
BoxDig.core={newBox:newBox,rollItem:rollItem};

/* ---------- juice: sound / haptics ---------- */
var AC=null, muted=false;
function ac(){ if(muted) return null; try{ if(!AC){var C=window.AudioContext||window.webkitAudioContext; if(C) AC=new C();} if(AC&&AC.state==="suspended") AC.resume(); }catch(e){AC=null;} return AC; }
function tone(f,dur,type,vol,when,slideTo){ var a=ac(); if(!a) return; var t=a.currentTime+(when||0), o=a.createOscillator(), g=a.createGain();
  o.type=type||"sine"; o.frequency.setValueAtTime(f,t); if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
  g.gain.setValueAtTime(vol||.2,t); g.gain.exponentialRampToValueAtTime(.001,t+dur); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+.02); }
function noise(dur,vol,freq){ var a=ac(); if(!a) return; var len=Math.floor(a.sampleRate*dur), b=a.createBuffer(1,len,a.sampleRate), d=b.getChannelData(0);
  for(var i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len); var s=a.createBufferSource(), f=a.createBiquadFilter(), g=a.createGain();
  s.buffer=b; f.type="lowpass"; f.frequency.value=freq||900; g.gain.value=vol||.3; s.connect(f); f.connect(g); g.connect(a.destination); s.start(); }
var SFX={
  dig:function(){noise(.09,.35,700);},
  coin:function(){tone(988,.08,"square",.08);tone(1319,.18,"square",.08,.07);},
  decent:function(){tone(784,.1,"triangle",.18);tone(1046,.1,"triangle",.18,.08);tone(1318,.2,"triangle",.18,.16);},
  rare:function(){[523,659,784,1046,1318].forEach(function(f,i){tone(f,.22,"square",.09,i*.08);});tone(1568,.5,"triangle",.15,.42);},
  bust:function(){tone(400,.6,"sawtooth",.18,0,60);noise(.5,.5,500);},
  wrap:function(){tone(1200,.08,"square",.1);tone(1600,.25,"square",.1,.1);noise(.06,.2,3000);},
  flag:function(){tone(500,.06,"triangle",.15);},
  door:function(){noise(1.0,.25,350);tone(90,1,"sawtooth",.05,0,140);}
};
function buzz(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }
BoxDig.sfx=SFX; BoxDig.setMuted=function(m){muted=m;};

function icon(it){ if(!it) return ""; if(it.icon==="GOLD") return '<span class="gold"></span>'; if(it.icon==="SAFE") return '<span class="safe"></span>'; return it.icon; }
BoxDig.icon=icon;
function money(n){ return "$"+Math.round(n).toLocaleString("en-US"); }
BoxDig.money=money;

/* ---------- particles ---------- */
function FX(host){
  var cv=document.createElement("canvas"); cv.className="fx"; host.appendChild(cv);
  var ctx=cv.getContext("2d"), parts=[], running=false;
  function size(){ var r=host.getBoundingClientRect(), d=window.devicePixelRatio||1; cv.width=r.width*d; cv.height=r.height*d; ctx.setTransform(d,0,0,d,0,0); }
  size();
  function loop(){ var r=host.getBoundingClientRect(); ctx.clearRect(0,0,r.width,r.height);
    parts=parts.filter(function(p){ p.life-=1; p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; return p.life>0; });
    parts.forEach(function(p){ ctx.globalAlpha=Math.max(0,p.life/p.max); ctx.fillStyle=p.col; ctx.beginPath(); ctx.arc(p.x,p.y,p.s,0,7); ctx.fill(); });
    ctx.globalAlpha=1; if(parts.length) requestAnimationFrame(loop); else running=false; }
  return { burst:function(x,y,n,cols,spd){ for(var i=0;i<n;i++){ var a=Math.random()*6.28, v=(spd||2.5)*(.4+Math.random());
      parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1.2,g:.12,s:1.5+Math.random()*2.5,life:28+Math.random()*20,max:48,col:pick(cols,Math.random)}); }
      if(!running){running=true;requestAnimationFrame(loop);} }, resize:size };
}

/* ---------- single-box UI ---------- */
// opts: {size,hazards,odds,items,mult,hazardTypes,clearBonus,glint,longPressMs,label,cashText, rng}
BoxDig.mountBox=function(el, opts, done){
  var box=newBox(opts), flagMode=false, finished=false;
  el.innerHTML='<div class="screen" id="bdScreen">'+
    '<div class="hud"><span class="pill">'+(opts.label||"Box")+'</span><span class="pill money" id="bdCash">'+(opts.cashText||"")+'</span></div>'+
    '<div class="haul"><div class="lab">BOX HAUL (UNBANKED)</div><div class="big" id="bdHaul">$0</div></div>'+
    '<div class="boxwrap" id="bdWrap"><div class="grid" id="bdGrid"></div></div>'+
    '<div class="log" id="bdLog">Tap a square to dig. Long-press to flag.</div>'+
    '<div class="controls"><button class="btn green wide" id="bdWrapBtn">💰 Call it a wrap</button>'+
    '<div class="row"><button class="btn gray flagbtn" id="bdFlag" aria-label="Flag mode">🚩</button><div class="sub" style="flex:1;text-align:left;font-size:13px;align-self:center">Numbers = hazards touching that square. Hit one and you <b>lose this box\'s haul</b>.</div></div></div>'+
  '</div>';
  var scr=el.querySelector("#bdScreen"), grid=el.querySelector("#bdGrid"), haulEl=el.querySelector("#bdHaul"), logEl=el.querySelector("#bdLog");
  var maxW=Math.min(el.clientWidth||390,480)-28-24, cs=Math.floor((maxW-(box.N-1)*3)/box.N); cs=Math.min(cs,64);
  grid.style.gridTemplateColumns="repeat("+box.N+","+cs+"px)"; grid.style.fontSize=Math.round(cs*.5)+"px";
  var nodes=box.cells.map(function(cell){ var d=document.createElement("div"); d.className="cell"; d.style.width=d.style.height=cs+"px"; d.dataset.i=cell.i; grid.appendChild(d); return d; });
  var fx=FX(scr);
  function centerOf(node){ var a=node.getBoundingClientRect(), b=scr.getBoundingClientRect(); return {x:a.left-b.left+a.width/2,y:a.top-b.top+a.height/2}; }
  function floatText(node,txt,col){ var p=centerOf(node), f=document.createElement("div"); f.className="float"; f.textContent=txt; if(col) f.style.color=col; f.style.left=(p.x-30)+"px"; f.style.top=(p.y-20)+"px"; scr.appendChild(f); setTimeout(function(){f.remove();},1000); }
  function render(){
    box.cells.forEach(function(cell,i){ var d=nodes[i], cls="cell", h="";
      if(cell.dug&&!cell.hz){ cls+=" dug"; if(cell.item){cls+=" hasitem"; h+='<span class="it">'+icon(cell.item)+'</span>';} if(cell.n) h+='<span class="num n'+cell.n+'">'+cell.n+'</span>'; if(opts.glint&&box.glint(cell)) cls+=" glint"; }
      else if(cell.hz&&(box.state!=="playing")&&(box.state==="bust"||box.state==="cleared")){ cls+=" dug hz"+(cell===box.hitCell?" hit":""); h=cell.hz.icon; }
      else if(cell.flag) cls+=" flag";
      d.className=cls; d.innerHTML=h; });
    haulEl.textContent=money(box.haul);
  }
  function bump(){ haulEl.classList.remove("pop"); void haulEl.offsetWidth; haulEl.classList.add("pop"); setTimeout(function(){haulEl.classList.remove("pop");},130); }
  function finish(){ if(finished) return; finished=true;
    var res={state:box.state,banked:box.banked(),lost:box.lost,bonus:box.bonus,best:box.best,finds:box.finds.slice(),hit:box.hitCell&&box.hitCell.hz,dug:box.dugSafe,safeTotal:box.safeTotal};
    setTimeout(function(){done(res);}, box.state==="bust"?1300:box.state==="cleared"?900:250); }
  function doDig(i){
    var cell=box.cells[i], ev=box.dig(cell.r,cell.c); if(!ev.length) return;
    var rareHit=null, decentHit=null, coins=0;
    ev.forEach(function(e){
      if(e.type==="dig"){ var p=centerOf(nodes[e.cell.i]); fx.burst(p.x,p.y,7,["#8a6038","#b98a55","#5e3f22"],2);
        if(e.cell.item){ coins++; if(e.cell.item.cat==="rare") rareHit=e.cell; else if(e.cell.item.cat==="decent") decentHit=decentHit||e.cell;
          if(ev.length<6||e.cell.item.cat!=="junk") floatText(nodes[e.cell.i],"+"+money(e.cell.item.val), e.cell.item.cat==="rare"?"#fff36a":null); } }
    });
    var last=ev[ev.length-1];
    if(last.type==="bust"){ render(); SFX.bust(); buzz([80,40,200]); scr.classList.add("shake"); var fl=document.createElement("div"); fl.className="flash"; scr.appendChild(fl);
      var p=centerOf(nodes[last.cell.i]); fx.burst(p.x,p.y,40,["#ff4a3a","#ffb000","#fff"],5);
      logEl.innerHTML="💥 "+last.cell.hz.icon+" "+last.cell.hz.name+"! Lost "+money(last.lost); finish(); return; }
    SFX.dig(); buzz(12);
    if(rareHit){ SFX.rare(); buzz([30,30,30,30,120]); var q=centerOf(nodes[rareHit.i]); fx.burst(q.x,q.y,36,["#ffe04d","#fff6b0","#f5b400"],4.5); logEl.innerHTML="🤑 "+icon(rareHit.item)+" "+rareHit.item.name+"! "+money(rareHit.item.val); }
    else if(decentHit){ SFX.decent(); buzz(25); logEl.innerHTML=icon(decentHit.item)+" "+decentHit.item.name+" — "+money(decentHit.item.val); }
    else if(coins){ SFX.coin(); var it=ev.filter(function(e){return e.cell&&e.cell.item;}).pop().cell.item; logEl.innerHTML=icon(it)+" "+it.name+" — "+money(it.val); }
    else logEl.textContent=ev.length>1?"Dusty patch… nothing but dirt.":"Just dust.";
    if(coins) bump();
    render();
    if(last.type==="clear"){ SFX.rare(); buzz([40,40,40,40,40]); logEl.innerHTML="🏆 Box cleared! Bonus +"+money(last.bonus); finish(); }
  }
  function doFlag(i){ var cell=box.cells[i]; if(box.toggleFlag(cell.r,cell.c)){ SFX.flag(); buzz(20); render(); } }
  // pointer handling: tap = dig, long-press = flag
  var lp=null, lpFired=false, downI=-1;
  grid.addEventListener("pointerdown",function(e){ var t=e.target.closest(".cell"); if(!t) return; ac(); downI=+t.dataset.i; lpFired=false; clearTimeout(lp);
    lp=setTimeout(function(){ lpFired=true; doFlag(downI); }, opts.longPressMs||380); });
  grid.addEventListener("pointerup",function(e){ clearTimeout(lp); var t=e.target.closest(".cell"); if(!t||lpFired||+t.dataset.i!==downI) return; if(flagMode) doFlag(downI); else doDig(downI); });
  grid.addEventListener("pointercancel",function(){clearTimeout(lp);});
  grid.addEventListener("pointerleave",function(){clearTimeout(lp);});
  grid.addEventListener("contextmenu",function(e){e.preventDefault();});
  el.querySelector("#bdFlag").onclick=function(){ flagMode=!flagMode; this.classList.toggle("on",flagMode); logEl.textContent=flagMode?"Flag mode: tap to mark suspected hazards.":"Dig mode."; };
  el.querySelector("#bdWrapBtn").onclick=function(){ if(box.state!=="playing") return; box.wrap(); SFX.wrap(); buzz([20,30,20]); logEl.innerHTML="💰 Banked "+money(box.haul)+"!"; render(); finish(); };
  render();
  var handle={box:box, dig:function(r,c){doDig(r*box.N+c);}, flag:function(r,c){doFlag(r*box.N+c);}, wrap:function(){el.querySelector("#bdWrapBtn").onclick();}};
  BoxDig._active=handle;
  return handle;
};

/* ---------- full game shell ---------- */
BoxDig.start=function(config, onFinish, rootEl){
  var C=config, app=rootEl||document.getElementById("app"), KEY="boxdig_save_v1";
  var S=load();
  function fresh(){ return {cash:C.startCash, unlocked:1, bestFind:null, unitsDone:0, run:null, muted:false}; }
  function load(){ try{ var s=JSON.parse(localStorage.getItem(KEY)); if(s&&typeof s.cash==="number") return s; }catch(e){} return fresh(); }
  function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
  BoxDig.state=function(){return S;}; BoxDig.reset=function(){S=fresh();save();title();};
  muted=!!S.muted;
  function unitCost(u){ var idx=C.units.indexOf(u); if(idx===0 && S.cash<u.cost) return 0; return u.cost; } // broke? first unit is on the house
  function doorStyle(u){ return "--dc:"+u.door[0]+";--dd:"+u.door[1]; }
  function muteBtn(){ var b=document.createElement("button"); b.className="mute"; b.textContent=muted?"🔇":"🔊"; b.onclick=function(){ muted=!muted; S.muted=muted; save(); b.textContent=muted?"🔇":"🔊"; }; app.appendChild(b); }
  function nextUnit(){ return C.units[Math.min(S.unlocked,C.units.length)-1]; }

  function title(){
    var u=S.run?C.units[S.run.u]:nextUnit();
    app.innerHTML='<div class="screen" style="justify-content:flex-start;gap:14px">'+
      '<div style="height:30px"></div><div class="title" style="font-size:22px;color:#ffb35c">STORAGE PIRATE</div>'+
      '<div class="title" style="font-size:54px;margin-top:-8px">BOX DIG</div>'+
      '<div class="unitframe" id="tFrame"><div class="unitinside"><div class="cbox small"></div><div class="cbox small"></div><div class="cbox small"></div><div class="cbox small"></div><div class="cbox small"></div></div><div class="door" style="'+doorStyle(u)+'"></div></div>'+
      '<div class="sub">Cash: <span class="money">'+money(S.cash)+'</span>'+(S.bestFind?' · Best find: '+icon(S.bestFind)+' '+money(S.bestFind.val):'')+'</div>'+
      '<div class="howto">📦 Open boxes and dig squares for loot.<br>🔢 Numbers tell you how many hazards touch that square.<br>💰 <b>Call it a wrap</b> to bank the box — hit a 🐀 or 🪤 and you lose it all.</div>'+
      '<div style="margin-top:auto;width:100%;display:flex;flex-direction:column;gap:12px">'+
      (S.run?'<button class="btn green wide" id="tCont">Continue '+u.name+'</button>':'<button class="btn wide" id="tPlay">Pick a unit</button>')+
      '</div></div>';
    muteBtn();
    var p=app.querySelector("#tPlay"), c=app.querySelector("#tCont");
    if(p) p.onclick=function(){ ac(); units(); };
    if(c) c.onclick=function(){ ac(); unitScreen(false); };
  }

  function units(){
    var h='<div class="screen" style="gap:10px"><div class="hud"><span class="pill">Pick a unit</span><span class="pill money">'+money(S.cash)+'</span></div><div class="ulist">';
    C.units.forEach(function(u,i){ var locked=i>=S.unlocked, cost=unitCost(u), cant=S.cash<cost;
      h+='<div class="urow'+(locked?' locked':'')+(i===S.unlocked-1?' next':'')+'" data-i="'+i+'"><div class="minidoor" style="'+doorStyle(u)+'"></div><div><div class="nm">'+(locked?'🔒 ':'')+u.name+'</div><div class="ds">'+u.desc+' · '+u.boxes.length+' boxes</div></div>'+
      '<div class="pr">'+(cost===0?'FREE':money(cost))+(cant&&!locked?'<div style="font-size:11px;color:#ff8a7a">need more</div>':'')+(cost===0&&i===0&&u.cost>0?'<div style="font-size:11px">on the house</div>':'')+'</div></div>'; });
    h+='</div><div class="sub" style="margin-top:auto;font-size:13px">Profit from a unit unlocks the next door. Better doors = bigger treasure, more hazards.</div><button class="btn gray wide" id="uBack" style="margin-top:10px">Back</button></div>';
    app.innerHTML=h; muteBtn();
    app.querySelector("#uBack").onclick=title;
    app.querySelectorAll(".urow").forEach(function(r){ r.onclick=function(){ var i=+r.dataset.i, u=C.units[i], cost=unitCost(u); if(i>=S.unlocked||S.cash<cost){ buzz(30); return; }
      S.cash-=cost; S.run={u:i,cost:cost,box:0,results:[]}; save(); unitScreen(true); }; });
  }

  function unitScreen(intro){
    var u=C.units[S.run.u], run=S.run, banked=run.results.reduce(function(a,r){return a+r.banked;},0);
    var h='<div class="screen" style="gap:12px"><div class="hud"><span class="pill">'+u.name+'</span><span class="pill money">'+money(S.cash)+'</span></div>'+
      '<div class="haul"><div class="lab">BANKED THIS UNIT</div><div class="big">'+money(banked)+'</div><div class="sub" style="font-size:13px">Paid '+money(run.cost)+'</div></div>'+
      '<div class="unitframe" style="width:340px;height:330px"><div class="unitinside" id="uIn"></div><div class="door'+(intro?'':' up')+'" id="uDoor" style="'+doorStyle(u)+'"></div></div>'+
      '<div class="sub" id="uHint">'+(intro?'Tap to roll up the door':'Tap the next box to dig in')+'</div>'+
      '<div style="margin-top:auto;width:100%"><button class="btn wide" id="uGo">'+(intro?'Roll it up!':'Open box '+(run.box+1))+'</button></div></div>';
    app.innerHTML=h; muteBtn();
    var inside=app.querySelector("#uIn");
    u.boxes.forEach(function(b,i){ var d=document.createElement("div"); d.className="cbox"+(i<run.box?" done":""); var r=run.results[i];
      d.innerHTML='<span class="lbl">'+b[0]+'×'+b[0]+'</span>'+(r?'<span class="stamp '+(r.banked>0||r.state!=="bust"?'ok':'bad')+'">'+(r.state==="bust"?'BUSTED':money(r.banked))+'</span>':'');
      if(i===run.box) d.onclick=function(){ go(); }; inside.appendChild(d); });
    var opened=!intro;
    function go(){ if(!opened){ opened=true; SFX.door(); buzz(40); app.querySelector("#uDoor").classList.add("up"); app.querySelector("#uGo").textContent="Open box 1"; app.querySelector("#uHint").textContent="Grab a box and dig in"; return; }
      if(run.box>=u.boxes.length) return summary(); playBox(); }
    app.querySelector("#uGo").onclick=go;
    if(run.box>=u.boxes.length) summary();
  }

  function playBox(){
    var u=C.units[S.run.u], run=S.run, b=u.boxes[run.box];
    BoxDig.mountBox(app,{size:b[0],hazards:b[1],odds:u.odds,items:C.items,mult:u.mult,hazardTypes:C.hazards,clearBonus:C.clearBonus,glint:C.glintHints,longPressMs:C.longPressMs,
      label:u.name+" · Box "+(run.box+1)+"/"+u.boxes.length, cashText:money(S.cash)}, function(res){
      run.results.push({state:res.state,banked:res.banked,lost:res.lost,best:res.best?{icon:res.best.icon,name:res.best.name,val:res.best.val}:null});
      if(res.best&&(!S.bestFind||res.best.val>S.bestFind.val)) S.bestFind={icon:res.best.icon,name:res.best.name,val:res.best.val};
      run.box++; save(); boxResult(res);
    });
    muteBtn();
  }

  function boxResult(res){
    var u=C.units[S.run.u], last=S.run.box>=u.boxes.length, ov=document.createElement("div"); ov.className="ov";
    var finds=res.finds.filter(function(f){return f.cat!=="junk";}).slice(0,10).map(function(f){return icon(f);}).join(" ");
    if(res.state==="bust"){
      ov.innerHTML='<div class="card"><div class="bust-big">'+res.hit.icon+'</div><h2 style="color:#c22">BUSTED!</h2><div>'+res.hit.name+' got you.</div><div class="bigm bad">'+money(res.lost)+'</div><div>Box haul lost. Should\'ve called it a wrap…</div></div>'+
        '<button class="btn red wide" id="oNext">'+(last?'Unit summary':'Next box')+'</button>';
    } else {
      ov.innerHTML='<div class="card"><h2 style="color:#1a7a2a">'+(res.state==="cleared"?'🏆 BOX CLEARED!':'💰 THAT\'S A WRAP!')+'</h2><div>Banked</div><div class="bigm">'+money(res.banked)+'</div>'+
        (res.bonus?'<div>includes clear bonus <b>+'+money(res.bonus)+'</b></div>':'')+'<div class="finds">'+(finds||'🧦📰')+'</div>'+(res.best?'<div>Best: '+icon(res.best)+' '+res.best.name+' '+money(res.best.val)+'</div>':'')+'</div>'+
        '<button class="btn green wide" id="oNext">'+(last?'Unit summary':'Next box')+'</button>';
    }
    app.appendChild(ov);
    ov.querySelector("#oNext").onclick=function(){ if(last) summary(); else unitScreen(false); };
  }

  function summary(){
    var u=C.units[S.run.u], run=S.run, idx=S.run.u;
    var total=run.results.reduce(function(a,r){return a+r.banked;},0), profit=total-run.cost, busts=run.results.filter(function(r){return r.state==="bust";}).length;
    var best=null; run.results.forEach(function(r){ if(r.best&&(!best||r.best.val>best.val)) best=r.best; });
    S.cash+=total; S.unitsDone++;
    var unlockedNew=false; if(profit>0&&idx+1<C.units.length&&S.unlocked<idx+2){ S.unlocked=idx+2; unlockedNew=true; }
    S.run=null; save();
    var nxt=C.units[Math.min(idx+1,C.units.length-1)];
    app.innerHTML='<div class="screen"><div class="ov" style="position:absolute"><div class="card"><div class="minidoor" style="margin:0 auto 8px;width:70px;'+doorStyle(u)+'"></div><h2>'+u.name+' done!</h2>'+
      '<table><tr><td>Paid for unit</td><td>'+money(run.cost)+'</td></tr><tr><td>Total banked</td><td>'+money(total)+'</td></tr><tr><td>Busts</td><td>'+busts+' / '+run.results.length+'</td></tr>'+
      '<tr><td>Best find</td><td>'+(best?icon(best)+' '+best.name+' '+money(best.val):'—')+'</td></tr></table>'+
      '<div class="bigm'+(profit<0?' bad':'')+'" style="'+(profit<0?'text-decoration:none':'')+'">'+(profit>=0?'+':'−')+money(Math.abs(profit))+'</div>'+
      '<div>Cash now <b>'+money(S.cash)+'</b></div>'+(unlockedNew?'<div style="margin-top:6px;font-weight:900;color:#9a5d0a">🔓 '+nxt.name+' unlocked!</div>':'')+'</div>'+
      '<button class="btn wide" id="sNext">Pick next unit</button></div></div>';
    app.querySelector("#sNext").onclick=units;
    if(onFinish) try{ onFinish({unit:u.name,cost:run.cost,banked:total,profit:profit,best:best,cash:S.cash}); }catch(e){}
  }

  title();
  return {state:function(){return S;}, units:units, title:title};
};
})();

window.addEventListener("load",function(){ BoxDig.start(CONFIG, function(r){ /* hook for future merged game */ }); });
</script>
